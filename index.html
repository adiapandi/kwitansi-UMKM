<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Buku Kwitansi — Invoice & Kwitansi Generator</title>

<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#1C2541" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Buku Kwitansi" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />

<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: #F1EFEA; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  #root .fallback { padding: 24px; color: #6B7280; font-size: 14px; }
</style>

<!-- Firebase (compat build — bisa dipakai langsung tanpa bundler) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="./firebase-config.js"></script>

<!-- React (tanpa build step) -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"><div class="fallback">Memuat aplikasi...</div></div>

<script>
  // Ambil app.jsx, transform manual (bukan lewat auto-scan Babel) supaya
  // kita bisa paksa runtime JSX ke "classic" (React.createElement). Ini
  // menghindari bug di sebagian versi Babel Standalone yang defaultnya
  // pakai "automatic" runtime dan otomatis nyisipin `import` statement
  // dari "react/jsx-runtime" — yang gagal karena kita load React lewat
  // CDN biasa (bukan module system).
  (async function boot() {
    try {
      const res = await fetch('./app.jsx');
      if (!res.ok) throw new Error('Gagal fetch app.jsx (HTTP ' + res.status + ')');
      const source = await res.text();
      const { code } = Babel.transform(source, {
        presets: [['react', { runtime: 'classic' }]],
        filename: 'app.jsx',
      });
      const script = document.createElement('script');
      script.textContent = code;
      document.body.appendChild(script);
    } catch (err) {
      console.error(err);
      window.__appMounted = false;
      const root = document.getElementById('root');
      if (root) {
        root.innerHTML = '<div class="fallback" style="color:#B23A2F">' +
          'Aplikasi gagal dimuat.<br>' + (err && err.message ? err.message : err) +
          '<br>Buka Console (F12) untuk detail lengkap.</div>';
      }
    }
  })();
</script>

<script>
  // Kalau app.jsx gagal dimuat/dijalankan (mis. 404, error transpile),
  // tampilkan pesan yang jelas alih-alih layar putih kosong.
  window.addEventListener('error', function () {
    if (window.__appMounted) return;
    var root = document.getElementById('root');
    if (root) {
      root.innerHTML = '<div class="fallback" style="color:#B23A2F">' +
        'Aplikasi gagal dimuat.<br>Buka Console (F12) untuk lihat detail error, ' +
        'atau cek apakah <code>app.jsx</code> ter-upload dengan nama yang persis sama (case-sensitive).' +
        '</div>';
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(console.error);
    });
  }
</script>
</body>
</html>
